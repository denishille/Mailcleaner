<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GeoQuiz – Land des Tages & GeoRankle</title>
<meta name="description" content="Zwei tägliche Geografie-Rätsel: Errate das geheime Land in 5 Versuchen und finde bei GeoRankle die beste Kategorie jedes Landes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">GeoQuiz</div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="daily" role="tab">Land des Tages</button>
    <button class="tab" data-view="rankle" role="tab">GeoRankle</button>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="btn-stats" title="Statistik" aria-label="Statistik"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  </div>
</header>

<main>
  <!-- ================= Land des Tages ================= -->
  <section id="view-daily" class="view active">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="daily-num" class="num"></span>Land des Tages</h1>
        <p class="sub" id="daily-sub">Errate das geheime Land in 5 Versuchen. Alle spielen heute dasselbe Land.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <button class="nav-btn" id="daily-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="daily-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="daily-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <form id="guess-form" class="guess-form" autocomplete="off" role="search">
      <div class="combo">
        <input id="guess-input" type="search" name="q" placeholder="Land eingeben …" aria-label="Land" role="combobox" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore data-form-type="other">
        <ul id="suggest" class="suggest" hidden></ul>
      </div>
      <button type="submit" class="primary" id="guess-btn">Raten</button>
    </form>
    <div class="legend">
      <span><i class="sq ok"></i> Treffer</span>
      <span><i class="sq miss"></i> Daneben</span>
    </div>

    <div id="guesses" class="guesses"></div>

    <div id="daily-result" class="result" hidden></div>
  </section>

  <!-- ================= GeoRankle ================= -->
  <section id="view-rankle" class="view">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="rankle-num" class="num"></span>GeoRankle</h1>
        <p class="sub">Wähle für jedes Land die Kategorie, in der es weltweit am besten abschneidet.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <button class="nav-btn" id="rankle-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="rankle-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="rankle-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <div id="rankle-board" class="rankle-board">
      <div class="rankle-status">
        <div class="rounds" id="rankle-rounds"></div>
        <div class="score"><strong id="rankle-score">0</strong>/ 800 Punkte</div>
      </div>

      <div class="flag-card" id="flag-card">
        <div class="flag-wrap" id="flag-wrap"></div>
        <div class="flag-meta">
          <h2 id="rankle-country" class="display"></h2>
          <p class="muted" id="rankle-country-sub"></p>
        </div>
      </div>

      <div id="cat-grid" class="cat-grid"></div>

      <div id="rankle-reveal" class="reveal" hidden></div>
    </div>

    <div id="rankle-result" class="result" hidden></div>
  </section>
</main>

<!-- Modals -->
<div class="modal" id="modal-stats" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <div id="stats-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
