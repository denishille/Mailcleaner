<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Geobrudis</title>
<meta name="description" content="Drei tägliche Geografie-Rätsel: Errate das geheime Land in 5 Versuchen und finde bei GeoRank die beste Kategorie jedes Landes.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Geobrudis">
<meta name="application-name" content="Geobrudis">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="brand-logo" src="logo.svg" alt="Geobrudis" onload="this.closest('.brand').classList.add('has-logo')" onerror="this.remove()">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 512 512" width="26" height="26"><circle cx="256" cy="256" r="238" fill="#d9ff3d"/><g fill="none" stroke="#111111" stroke-width="30" stroke-linecap="round"><path d="M58 178h396M58 334h396"/><ellipse cx="256" cy="256" rx="102" ry="238"/></g></svg></span>
    <span class="brand-text">Geobrudis</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="daily" role="tab">GeoFind</button>
    <button class="tab" data-view="rankle" role="tab">GeoRank</button>
    <button class="tab" data-view="flag" role="tab">GeoFlag</button>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="btn-stats" title="Statistik" aria-label="Statistik"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  </div>
</header>

<main>
  <!-- ================= Land des Tages ================= -->
  <section id="view-daily" class="view active">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="daily-num" class="num"></span>GeoFind</h1>
        <p class="sub" id="daily-sub">Errate das geheime Land in 5 Versuchen.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="daily-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="daily-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="daily-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="daily-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <form id="guess-form" class="guess-form" autocomplete="off" role="search">
      <div class="combo">
        <input id="guess-input" type="search" name="q" placeholder="Tipp eingeben …" aria-label="Tipp" role="combobox" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore data-form-type="other">
        <ul id="suggest" class="suggest" hidden></ul>
      </div>
      <button type="submit" class="primary" id="guess-btn">Raten</button>
    </form>
    <div class="legend">
      <span><i class="sq ok"></i> Treffer</span>
      <span><i class="sq miss"></i> Daneben</span>
    </div>

    <div id="daily-result" class="result" hidden></div>

    <div id="guesses" class="guesses"></div>
  </section>

  <!-- ================= GeoRankle ================= -->
  <section id="view-rankle" class="view">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="rankle-num" class="num"></span>GeoRank</h1>
        <p class="sub">Welche Kategorie ist die Stärke des Landes?</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="rankle-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="rankle-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="rankle-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="rankle-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <div id="rankle-board" class="rankle-board">
      <div class="rankle-status">
        <div class="rounds" id="rankle-rounds"></div>
        <div class="score"><strong id="rankle-score">0</strong>/ 800 Punkte</div>
      </div>

      <div class="flag-card" id="flag-card">
        <div class="flag-wrap" id="flag-wrap"></div>
        <div class="flag-meta">
          <h2 id="rankle-country" class="display"></h2>
          <p class="muted" id="rankle-country-sub"></p>
        </div>
      </div>

      <div id="cat-grid" class="cat-grid"></div>

    </div>

    <div id="rankle-result" class="result" hidden></div>
  </section>

  <!-- ================= GeoFlag ================= -->
  <section id="view-flag" class="view">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="flag-num" class="num"></span>GeoFlag</h1>
        <p class="sub">Welches Land gehört zur Flagge?</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="flag-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="flag-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="flag-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="flag-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <div id="flag-board">
      <div class="rankle-status">
        <div class="rounds" id="flag-rounds"></div>
        <div class="score"><strong id="flag-score">0</strong>/ 10 richtig</div>
      </div>
      <div class="flag-card flag-quiz">
        <div class="flag-wrap" id="flag-quiz-wrap"></div>
        <div class="flag-meta">
          <h2 id="flag-quiz-title" class="display">Runde 1</h2>
          <p class="muted" id="flag-quiz-sub"></p>
        </div>
      </div>
      <div id="flag-answers" class="answers"></div>
    </div>

    <div id="flag-result" class="result" hidden></div>
  </section>
</main>

<!-- Modals -->
<div class="modal" id="modal-stats" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <div id="stats-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
